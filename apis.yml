name: Strise
description: >-
  Strise is an Oslo-based (founded 2019) AI platform for financial-crime
  compliance — "The Autonomous FinCrime Department" that European fincrime teams
  run on. It automates AML and KYC/KYB work across a Knowledge Graph of
  companies, persons, ownership, PEP/sanctions and adverse-media screening,
  continuous monitoring, identity verification and risk scoring. Beyond the SaaS
  modules (SuperData, RiskLense, Compliance Memory, KYB, KYC, Monitoring, IDV,
  Forms, Grow), Strise exposes its platform programmatically through the Strise
  Connect API — a GraphQL API for search, screening, portfolio monitoring,
  reviews and webhooks — and a hosted, OAuth-protected MCP server for AI agents.
